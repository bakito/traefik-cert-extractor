name: Build images

on:
  push:
    branches: main
  release:
    types:
      - published

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{github.event.release.tag_name }}
        id: docker_build_release
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: ${{ github.event.release.tag_name != '' }}
        with:
          push: true
          tags: ghcr.io/bakito/traefik-cert-extractor:latest,ghcr.io/bakito/traefik-cert-extractor:${{ github.event.release.tag_name }}
          platforms: linux/amd64 #,linux/arm64,linux/arm/v7
          provenance: false
          build-args: VERSION=${{ github.event.release.tag_name }}

      - name: Build and push main
        id: docker_build_main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: ${{ github.event.release.tag_name == '' }}
        with:
          push: true
          tags: ghcr.io/bakito/traefik-cert-extractor:main
          platforms: linux/amd64 #,linux/arm64,linux/arm/v7
          provenance: false
          build-args: VERSION=main
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}


